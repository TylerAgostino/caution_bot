global
    log stdout format raw local0
    maxconn 4096
    # Daemon mode disabled for Docker
    # Note: stats socket disabled in Docker (use HTTP stats instead)
    # stats socket /var/run/haproxy.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  redispatch
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    # Longer timeout for SSE connections
    timeout tunnel  24h

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-desc Caution Bot Overlay Failover
    stats admin if TRUE

frontend overlay_frontend
    bind *:8080
    mode http
    option httplog
    default_backend overlay_backend

backend overlay_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health hdr host localhost
    http-check expect status 200
    option redispatch
    retries 2
    server live 192.168.1.221:8765 check inter 2s rise 2 fall 2 weight 100
    server dev 192.168.1.231:8765 check inter 2s rise 1 fall 3 backup
    server preview 192.168.1.231:9765 check inter 2s rise 1 fall 3 backup
