<!doctype html>
<!--
  Caution Bot Broadcast Overlay  —  Full Qualifying Standings
  ============================================================
  OBS Browser Source:  http://localhost:{{PORT}}/standings
  Width: {{WIDTH}}   Height: {{HEIGHT}}
  Enable "Allow transparency" in browser-source properties.

  Shows a full timing board for the F1 qualifying event with
  individual lap times for every subsession (Q1, Q2, Q3, …).
  The board is centred on screen so it can be placed anywhere.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            /* ── Fonts ─────────────────────────────────────────────────────────────── */
            /* Local files are tried first (served by the overlay HTTP server).        */
            /* Google Fonts CDN is used as an automatic fallback when the files are    */
            /* absent.  Run download_fonts.py to populate the local fonts/ directory.  */
            @font-face {
              font-family: Saira-Black;
              src: url("/static/fonts/Saira-Black.ttf") format("truetype"),
                   url("https://fonts.gstatic.com/s/saira/v23/memWYa2wxmKQyPMrZX79wwYZQMhsyuShhKMjjbU9uXuA7_PFosg.ttf") format("truetype");
            }
            @font-face {
              font-family: Saira-Bold;
              src: url("/static/fonts/Saira-Bold.ttf") format("truetype"),
                   url("https://fonts.gstatic.com/s/saira/v23/memWYa2wxmKQyPMrZX79wwYZQMhsyuShhKMjjbU9uXuA773Fosg.ttf") format("truetype");
            }
            @font-face {
              font-family: Saira-Regular;
              src: url("/static/fonts/Saira-Regular.ttf") format("truetype"),
                   url("https://fonts.gstatic.com/s/saira/v23/memWYa2wxmKQyPMrZX79wwYZQMhsyuShhKMjjbU9uXuA71rCosg.ttf") format("truetype");
            }
            @font-face {
              font-family: Saira-BoldItalic;
              font-style: italic;
              src: url("/static/fonts/Saira-BoldItalic.ttf") format("truetype"),
                   url("https://fonts.gstatic.com/s/saira/v23/memUYa2wxmKQyNkiV50dulWP7s95AqZTzZHcVdxWI9WH-pKBrYwxkw.ttf") format("truetype");
            }

            /* ── Theme variables ────────────────────────────────────────────────────── */
            :root {
              --accent:    #34D6B1;
              --danger:    #FC5500;
              --elim:      #B73C3C;
              --bg:        #192433;
              --bg-dark:   #0d1721;
              --bg-hdr:    #111d2a;
              --text:      #ffffff;
              --dimmed:    #888888;
              --fn-black:  Saira-Black,      sans-serif;
              --fn-bold:   Saira-Bold,       sans-serif;
              --fn-reg:    Saira-Regular,    sans-serif;
              --fn-ital:   Saira-BoldItalic, sans-serif;
            }

            /* ── Reset ──────────────────────────────────────────────────────────────── */
            *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

            html, body {
              width:  {{WIDTH}}px;
              height: {{HEIGHT}}px;
              background: transparent;
              overflow: hidden;
            }

            .overlay { width: 100%; height: 100%; position: relative; }


            /* ═══════════════════════════════════════════════════════════════════════ */
            /* STANDINGS BOARD                                                         */
            /* ═══════════════════════════════════════════════════════════════════════ */

            #standings-board {
              position: absolute;
              top:  110px;
              /* Horizontally centred on the canvas */
              left: 50%;
              transform: translateX(-50%);
              width: 700px;
              border-radius: 4px;
              overflow: hidden;
              box-shadow: 0 6px 28px rgba(0, 0, 0, 0.75);
              opacity: 0;
              transition: opacity 0.4s ease;
            }
            #standings-board.visible { opacity: 1; }

            /* ── Board header ── */
            .board-header {
              display: flex;
              align-items: center;
              justify-content: space-between;
              background: var(--accent);
              padding: 0 12px;
              height: 36px;
              gap: 10px;
              transition: background 0.3s ease;
            }

            .board-session {
              font-family: var(--fn-black);
              font-size: 15px;
              color: #000;
              flex: 1;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
              transition: color 0.2s;
            }

            .board-timer {
              font-family: var(--fn-bold);
              font-size: 15px;
              color: #000;
              font-variant-numeric: tabular-nums;
              flex-shrink: 0;
              transition: color 0.2s;
            }

            /* ── Full-header GREEN FLAG ── */
            .board-header.flag-green {
              animation: header-go 4.5s ease-out forwards;
            }
            @keyframes header-go {
              0%, 40%  { background: #00c853; }
              100%     { background: #34D6B1; }
            }

            /* ── Full-header CHECKERED FLAG ── */
            .board-header.flag-checkered {
              background-image:
                linear-gradient(rgba(0, 0, 0, 0.52), rgba(0, 0, 0, 0.52)),
                linear-gradient(45deg, #000 25%, transparent 25%),
                linear-gradient(-45deg, #000 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #000 75%),
                linear-gradient(-45deg, transparent 75%, #000 75%);
              background-size:     auto, 12px 12px, 12px 12px, 12px 12px, 12px 12px;
              background-position: 0 0,  0 0,      0 6px,      6px -6px,  -6px 0px;
              background-color: #fff;
              animation: none;
            }
            .board-header.flag-checkered .board-session,
            .board-header.flag-checkered .board-timer { color: #fff; }

            /* ── Column header row ── */
            .col-headers {
              display: flex;
              align-items: center;
              height: 24px;
              background: var(--bg-hdr);
              border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .col-h {
              font-family: var(--fn-bold);
              font-size: 10px;
              color: rgba(255, 255, 255, 0.45);
              text-transform: uppercase;
              letter-spacing: 1px;
            }
            .col-h.active-q { color: var(--accent); }

            /* ── Shared column widths ── */
            .col-indicator { width: 4px;  flex-shrink: 0; }
            .col-pos       { width: 34px; flex-shrink: 0; text-align: center; }
            .col-car       { width: 44px; flex-shrink: 0; text-align: center; }
            .col-name      { flex: 1;     min-width: 100px; padding: 0 6px; }
            .col-q {
              width: 92px;
              flex-shrink: 0;
              text-align: right;
              padding-right: 10px;
              font-variant-numeric: tabular-nums;
            }

            /* ── Driver rows ── */
            .standings-row {
              display: flex;
              align-items: center;
              height: 30px;
              border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .standings-row.safe            { background: var(--bg); }
            .standings-row.at_risk         { background: rgba(252, 85,  0, 0.90); }
            .standings-row.elimination_zone{ background: rgba(183, 60, 60, 0.90); }
            .standings-row.knocked_out     { background: var(--bg-dark); opacity: 0.90; }

            /* Left accent bar */
            .s-indicator { align-self: stretch; flex-shrink: 0; }
            .safe             .s-indicator { background: transparent; }
            .at_risk          .s-indicator { background: var(--danger); }
            .elimination_zone .s-indicator { background: var(--elim); }
            .knocked_out      .s-indicator { background: #444; }

            .s-pos  { font-family: var(--fn-bold); font-size: 12px; color: var(--text); }
            .s-car  { font-family: var(--fn-ital); font-size: 12px; color: var(--accent); }
            .s-name { font-family: var(--fn-reg);  font-size: 12px; color: var(--text);
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

            /* Session time cells — flex so the finished-flag sits left of the time */
            .s-time {
              display: flex;
              align-items: center;
              justify-content: flex-end;
              gap: 4px;
              font-family: var(--fn-bold);
              font-size: 12px;
              color: rgba(255, 255, 255, 0.55);
            }
            .s-time.active-q { color: var(--accent); }
            .s-time.empty    { color: rgba(255, 255, 255, 0.20); }

            /* Knocked-out: every column dimmed */
            .knocked_out .s-pos,
            .knocked_out .s-car,
            .knocked_out .s-name,
            .knocked_out .s-time { color: var(--dimmed); }

            /* "No Time" placeholder */
            .no-time-label {
              font-family: var(--fn-bold);
              font-size: 10px;
              color: var(--dimmed);
              letter-spacing: 0.3px;
              font-variant-numeric: normal;
            }

            /* Small checkered swatch for drivers who have taken the final-lap flag */
            .row-finished-flag {
              width: 10px;
              height: 10px;
              flex-shrink: 0;
              border-radius: 1px;
              background-image:
                linear-gradient(45deg, #000 25%, transparent 25%),
                linear-gradient(-45deg, #000 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #000 75%),
                linear-gradient(-45deg, transparent 75%, #000 75%);
              background-size:     4px 4px;
              background-position: 0 0, 0 2px, 2px -2px, -2px 0px;
              background-color: #fff;
            }

            /* ── Group divider ── */
            .group-divider {
              height: 2px;
              background: linear-gradient(to right, var(--accent) 30%, transparent);
            }
        </style>
    </head>
    <body>
        <div class="overlay">
            <div id="standings-board">
                <!-- Header (session name + timer; full-header flags applied via JS) -->
                <div class="board-header" id="board-header">
                    <span class="board-session" id="board-session"
                        >Qualifying Standings</span
                    >
                    <span class="board-timer" id="board-timer">--:--</span>
                </div>

                <!-- Column labels (rebuilt on each update) -->
                <div id="col-headers" class="col-headers"></div>

                <!-- Driver rows (rebuilt on each update) -->
                <div id="standings-list"></div>
            </div>
        </div>
        <!-- /.overlay -->

        <script>
            /* ====================================================================== */
            /* STANDINGS BOARD                                                          */
            /* ====================================================================== */

            const board = document.getElementById("standings-board");
            const boardHdr = document.getElementById("board-header");
            const sessionEl = document.getElementById("board-session");
            const timerEl = document.getElementById("board-timer");
            const colHdrEl = document.getElementById("col-headers");
            const listEl = document.getElementById("standings-list");

            let prevSessionName = "";
            let greenFlagTimer = null;

            // ── Helpers ──────────────────────────────────────────────────────────────

            function sessionDisplayLabel(name) {
                if (!name) return "Qualifying Standings";
                if (name.startsWith("Pre-"))
                    return name.slice(4) + " Begins In";
                return name;
            }

            /** Return the active Qn key (e.g. "Q2") if we are inside a live session. */
            function activeQFromName(name) {
                return name && !name.startsWith("Pre-") && /^Q\d+$/.test(name)
                    ? name
                    : null;
            }

            /**
             * Flash the board header green for 4.5 s then fade back to teal.
             */
            function showGreenFlag() {
                boardHdr.classList.remove("flag-checkered");
                boardHdr.classList.remove("flag-green");
                void boardHdr.offsetWidth; // restart animation
                boardHdr.classList.add("flag-green");
                if (greenFlagTimer) clearTimeout(greenFlagTimer);
                greenFlagTimer = setTimeout(
                    () => boardHdr.classList.remove("flag-green"),
                    4500,
                );
            }

            function esc(str) {
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            // ── Column header builder ─────────────────────────────────────────────────

            function buildColHeaders(sessions, activeQ) {
                let html =
                    `<div class="col-h col-indicator"></div>` +
                    `<div class="col-h col-pos">P</div>` +
                    `<div class="col-h col-car">#</div>` +
                    `<div class="col-h col-name">Driver</div>`;
                sessions.forEach((q) => {
                    const cls = q === activeQ ? " active-q" : "";
                    html += `<div class="col-h col-q${cls}">${esc(q)}</div>`;
                });
                colHdrEl.innerHTML = html;
            }

            // ── Row builder ──────────────────────────────────────────────────────────

            /**
             * Build one standings-row HTML string.
             * @param {object}  d            – driver object from SSE state
             * @param {string[]} sessions    – array of session keys, e.g. ["Q1","Q2"]
             * @param {string|null} activeQ  – current active session key, or null
             * @param {boolean} checkeredOut – whether the session checkered is currently out
             */
            function makeStandingsRow(d, sessions, activeQ, checkeredOut) {
                const times = d.session_times || {};

                let html = `<div class="standings-row ${esc(d.status || "safe")}">`;
                html += `<div class="s-indicator col-indicator"></div>`;
                html += `<div class="s-pos col-pos">${esc(String(d.position))}</div>`;
                html += `<div class="s-car col-car">${esc(d.car_num)}</div>`;
                html += `<div class="s-name col-name">${esc(d.driver_name)}</div>`;

                sessions.forEach((q) => {
                    const t = times[q] || "";
                    const isActive = q === activeQ;
                    let cellClass = `s-time col-q${isActive ? " active-q" : ""}`;
                    let cellInner;

                    if (
                        isActive &&
                        d.no_current_time &&
                        d.status !== "knocked_out"
                    ) {
                        // Advanced to this session but hasn't set a lap yet
                        cellInner =
                            '<span class="no-time-label">No Time</span>';
                    } else if (!t) {
                        // Session hasn't been reached yet, or driver was absent
                        cellInner =
                            '<span style="color:rgba(255,255,255,0.18)">—</span>';
                        cellClass += " empty";
                    } else {
                        // Normal time; add finished-flag icon if applicable
                        const flagHtml =
                            isActive &&
                            checkeredOut &&
                            d.finished &&
                            d.status !== "knocked_out"
                                ? '<span class="row-finished-flag"></span>'
                                : "";
                        cellInner = flagHtml + esc(t);
                    }

                    html += `<div class="${cellClass}">${cellInner}</div>`;
                });

                html += `</div>`;
                return html;
            }

            // ── Main update ───────────────────────────────────────────────────────────

            function updateBoard(state) {
                const {
                    session_name = "",
                    time_remaining = "--:--",
                    checkered_flag = false,
                    sessions = [],
                    drivers = [],
                } = state;

                // Detect Pre-Qn → Qn transition for green flag
                const wasPreSession = prevSessionName.startsWith("Pre-");
                const isPreSession = session_name.startsWith("Pre-");
                if (wasPreSession && !isPreSession && prevSessionName !== "")
                    showGreenFlag();
                prevSessionName = session_name;

                // ── Header ──
                sessionEl.textContent = sessionDisplayLabel(session_name);

                if (checkered_flag) {
                    boardHdr.classList.add("flag-checkered");
                    boardHdr.classList.remove("flag-green");
                    if (greenFlagTimer) {
                        clearTimeout(greenFlagTimer);
                        greenFlagTimer = null;
                    }
                    timerEl.style.display = "none";
                } else {
                    boardHdr.classList.remove("flag-checkered");
                    timerEl.style.display = "";
                    timerEl.textContent = time_remaining;
                }

                if (!drivers.length) return;

                const activeQ = activeQFromName(session_name);

                // Rebuild column headers
                buildColHeaders(sessions, activeQ);

                // Build driver rows
                const active = drivers.filter(
                    (d) => d.status !== "knocked_out",
                );
                const knockedOut = drivers.filter(
                    (d) => d.status === "knocked_out",
                );

                const parts = [];
                active.forEach((d) =>
                    parts.push(
                        makeStandingsRow(d, sessions, activeQ, checkered_flag),
                    ),
                );
                if (knockedOut.length) {
                    parts.push('<div class="group-divider"></div>');
                    knockedOut.forEach((d) =>
                        parts.push(
                            makeStandingsRow(d, sessions, activeQ, false),
                        ),
                    );
                }

                listEl.innerHTML = parts.join("");
                board.classList.add("visible");
            }

            // ── SSE connection ────────────────────────────────────────────────────────

            const f1Src = new EventSource("/sse/f1");
            f1Src.onmessage = (e) => {
                try {
                    updateBoard(JSON.parse(e.data));
                } catch (_) {}
            };
        </script>
    </body>
</html>
